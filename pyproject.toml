[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Sales"
version = "0.1.0"
description = "Dataset de vendas"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    {name = "Dyego Nery", email="dyegonery@gmail.com"}
]

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "seaborn",
    "matplotlib",
    "kaggle"
]

[project.optional-dependencies]
notebook = [
    "jupiterlab",
    "notebook",
    "ipykernel"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]